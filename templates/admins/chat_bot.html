{% load static %}
<div id="chatbot-widget">
    <!-- Rounded logo when minimized -->
    <div id="chatbot-logo" onclick="toggleChatbot()" title="Assistant">
        <!-- <img src="{% static 'admins/home/img/bride.jpg' %}" class="img-fluid" alt=""> -->
    </div>

    <!-- Full chat window -->
    <div id="chatbot-body" style="display:none;">
        <div id="chatbot-header">
            <h4 style="color: white;">Chatbot</h4>
            <div onclick="toggleChatbot()" style="padding: 5px;">✖</div>


        </div>
        <div id="chatbot-box"></div>
        <div id="chatbot-input">
            <input type="text" id="chatbot-message" placeholder="Type / for commands" onkeyup="showSuggestions(event)">
            <button onclick="sendChatbotMessage()">Send</button>
        </div>
        <div id="chatbot-suggestions"
            style="display:none; background:#f9f9f9; color: black; border-top:1px solid #ddd; padding:5px; font-size:13px;">
        </div>
    </div>
</div>

<style>
    #chatbot-widget {
        position: fixed;
        bottom: 50px;
        right: 90px;
        font-family: Arial, sans-serif;
        z-index: 9999;
    }

    .chatbot-input button {
        font-size: 1.25rem;
    }

    .message-bot table {
        border-collapse: collapse;
        width: auto;
        /* shrink to fit content */
        max-width: 90%;
        /* don’t overflow bubble */
        margin: 5px 0;
        font-size: 13px;
        text-align: center;
        background: #fdfdfd;
        border-radius: 8px;
        overflow: hidden;
    }

    .message-bot th {
        background: #007bff;
        color: white;
        padding: 6px 10px;
        font-weight: bold;
    }

    .message-bot td {
        padding: 6px 10px;
        border: 1px solid #ddd;
    }

    .message-bot tr:nth-child(even) {
        background: #f9f9f9;
        /* striped rows */
    }


    /* Rounded logo button */
    #chatbot-logo {
        width: 80px;
        height: 80px;
        background: rgb(240, 240, 240);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        background-image: url("{% static 'admins/home/img/Ai Robot Vector Art.gif' %}");
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-15px);
        }

        100% {
            transform: translateY(0);
        }
    }


    /* Chat window */
    #chatbot-body {
        width: 500px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    #chatbot-header {
        background: green;
        color: white;
        padding: 10px;
        border-radius: 8px 8px 0 0;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #chatbot-box {
        height: 250px;
        overflow-y: auto;
        padding: 10px;
        font-size: 14px;
    }

    #chatbot-input {
        display: flex;
        border-top: 1px solid #ddd;
    }

    #chatbot-input input {
        flex: 1;
        border: none;
        padding: 8px;
    }

    #chatbot-input button {
        background: green;
        color: white;
        border: none;
        padding: 8px 12px;
        cursor: pointer;
    }

    .message-user {
        display: flex;
        justify-content: flex-end;
        margin: 10px 0;
    }

    .message-user span {
        background-color: #dcf8c6;
        color: black;
        /* WhatsApp user bubble color */
        padding: 8px 12px;
        border-radius: 15px 15px 0 15px;
        max-width: 70%;
        word-wrap: break-word;
        font-size: 14px;
    }

    .message-bot {
        display: flex;
        justify-content: flex-start;
        margin: 10px 0;
    }

    .message-bot span {
        background-color: #ffffff;
        color: black;
        /* WhatsApp bot bubble color */
        border: 1px solid #ddd;
        padding: 8px 12px;
        border-radius: 15px 15px 15px 0;
        max-width: 70%;
        word-wrap: break-word;
        font-size: 14px;
    }


    .suggestion {
        cursor: pointer;
        padding: 3px;
        font-size: 1.25rem;
    }

    .suggestion:hover {
        background: #eee;
    }
</style>

<script>
    const commands = [
        "/recent logins",
        "/progress <project_id>",
        "/rejection history",
        "/users and their department"
    ];

    function toggleChatbot() {
        const body = document.getElementById("chatbot-body");
        const logo = document.getElementById("chatbot-logo");
        if (body.style.display === "none") {
            body.style.display = "block";
            logo.style.display = "none";
        } else {
            body.style.display = "none";
            logo.style.display = "flex";
        }
    }



    function sendChatbotMessage() {


        const input = document.getElementById("chatbot-message");
        const message = input.value.trim();
        if (!message) return;

        const box = document.getElementById("chatbot-box");
        box.innerHTML += `<div class="message-user">
    <span>${message}</span>
</div>`;


        fetch(`/chat/?message=${encodeURIComponent(message)}`)
            .then(res => res.json()).then(data => {
                let formatted;

                // Handle /progress response with table design
                if (data.overall_progress) {
                    formatted = `
            <b>Project ${data.project_id}</b><br>
            <table style="border-collapse:collapse; width:100%; font-size:13px; text-align:center; margin: 15px 0;">
              <tr style="background:#007bff; color:white;">
                <th>Module</th><th>Status</th>
              </tr>
              <tr><td>Cultivator</td><td style="color:${data.cul_progress === 'Done' ? 'green' : 'red'}">${data.cul_progress}</td></tr>
              <tr><td>Accumulator</td><td style="color:${data.acc_progress === 'Done' ? 'green' : 'red'}">${data.acc_progress}</td></tr>
              <tr><td>Extractor</td><td style="color:${data.ext_progress === 'Done' ? 'green' : 'red'}">${data.ext_progress}</td></tr>
              <tr><td>Sustainer</td><td style="color:${data.sus_progress === 'Done' ? 'green' : 'red'}">${data.sus_progress}</td></tr>
            </table>
            <b>Overall Progress: ${data.overall_progress}</b>
        `;
                }
                // Handle array responses (/recent logins, /rejection history, /users and their department)
                else if (Array.isArray(data)) {
                    if (data.length > 0 && data[0].name && data[0].department) {
                        formatted = `
                <table style="border-collapse:collapse; width:100%; font-size:13px; text-align:center;">
                  <tr style="background:#007bff; color:white;">
                    <th>Name</th><th>Department</th>
                  </tr>
                  ${data.map(item => `
                    <tr>
                      <td>${item.name}</td>
                      <td>${item.department}</td>
                    </tr>`).join("")}
                </table>
            `;
                    } else {
                        formatted = data.map(item => Object.values(item).join(" | ")).join("<br>");
                    }
                }
                // Handle single object responses
                else if (typeof data === "object") {
                    formatted = `
            <table style="border-collapse:collapse; width:100%; font-size:13px; text-align:center;">
              ${Object.entries(data).map(([k, v]) => `${v}`).join("")}
            </table>
        `;
                }
                // Fallback
                else {
                    formatted = data;
                }

                box.innerHTML += `<div class="message-bot outside">
    <span>${formatted || "No Recent Logins"}</span>
</div>`;
                box.scrollTop = box.scrollHeight;


            }).catch(err => {
                box.innerHTML += `<div class="message-bot inside ">
    <span>${err}</span>
</div>`;

                box.scrollTop = box.scrollHeight;


            });

        input.value = "";
        document.getElementById("chatbot-suggestions").style.display = "none";
    }

    function showSuggestions(event) {
        const input = event.target.value;
        const suggestionsBox = document.getElementById("chatbot-suggestions");

        if (input.startsWith("/")) {
            const filtered = commands.filter(cmd => cmd.startsWith(input));
            if (filtered.length > 0) {
                suggestionsBox.innerHTML = filtered.map(cmd => `<div class="suggestion" onclick="selectSuggestion('${cmd}')">${cmd}</div>`).join("");
                suggestionsBox.style.display = "block";
            } else {
                suggestionsBox.style.display = "none";
            }
        } else {
            suggestionsBox.style.display = "none";
        }
    }

    function selectSuggestion(cmd) {
        document.getElementById("chatbot-message").value = cmd;
        document.getElementById("chatbot-suggestions").style.display = "none";
    }

    document.getElementById("chatbot-message").addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
            event.preventDefault();   // prevent newline
            sendChatbotMessage();     // call your send function
        }
    });


</script>
