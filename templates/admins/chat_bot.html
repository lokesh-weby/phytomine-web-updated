{% load static %}
<!-- Phytomine Assistant Widget -->
<div id="chatbot-widget">
    <!-- Floating Button -->
    <div id="chatbot-logo" onclick="toggleChatbot()" title="Open Assistant">
        <div class="logo-inner"></div>
    </div>

    <!-- Chat Window -->
    <div id="chatbot-body" class="glass-effect" style="display:none;">
        <div id="chatbot-header">
            <div class="header-info">
                <div class="status-dot"></div>
                <h4>Phytomine Assistant</h4>
            </div>
            <div class="header-actions">
                <button onclick="clearChat()" title="Reset"><i class="fas fa-undo"></i></button>
                <button onclick="toggleChatbot()" title="Close"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <div id="chatbot-box">
            <div class="message-bot">
                <span>Hello! I am your Phytomine Assistant. Select a quick action below or type a command.</span>
            </div>
        </div>

        <!-- Static Command Tabs -->
        <div id="chatbot-tabs">
            <button onclick="sendStaticCommand('approvals')">Pending Approvals</button>
            <button onclick="sendStaticCommand('report')">Get Report</button>
            <button onclick="sendStaticCommand('progress')">Project Progress</button>
            <button onclick="sendStaticCommand('recent logins')">Recent Logins</button>
            <button onclick="sendStaticCommand('users')">Users List</button>
        </div>

        <div id="chatbot-input-container">
            <div class="input-wrapper">
                <input type="text" id="chatbot-message" placeholder="Type a command (e.g. 'progress')..." autocomplete="off"
                    onkeyup="handleKeyUp(event)">
                <button id="send-btn" onclick="sendChatbotMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    :root {
        --primary-green: #27ae60;
        --dark-bg: rgba(30, 30, 30, 0.9);
        --accent-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    #chatbot-widget {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 10000;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Floating Button */
    #chatbot-logo {
        width: 60px;
        height: 60px;
        background: var(--primary-green);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #chatbot-logo:hover {
        transform: scale(1.1);
    }

    .logo-inner {
        width: 100%;
        height: 100%;
        background-image: url("{% static 'admins/home/img/Ai Robot Vector Art.gif' %}");
        background-size: 70%;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* Chat Window */
    .glass-effect {
        background: var(--dark-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        box-shadow: var(--accent-glow);
    }

    #chatbot-body {
        width: max-content;
        height: 500px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    #chatbot-header {
        padding: 12px 15px;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-info {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .header-info h4 {
        margin: 0;
        color: white;
        font-weight: 500;
        font-size: 1rem;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        background: var(--primary-green);
        border-radius: 50%;
    }

    .header-actions button {
        background: none;
        border: none;
        color: #888;
        cursor: pointer;
        padding: 5px;
    }

    .header-actions button:hover {
        color: white;
    }

    /* Chat Box */
    #chatbot-box {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .message-user,
    .message-bot {
        max-width: 80%;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 0.9rem;
        line-height: 1.4;
    }

    .message-user {
        align-self: flex-end;
        background: var(--primary-green);
        color: white;
        border-bottom-right-radius: 2px;
    }

    .message-bot {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.08);
        color: #ddd;
        border-bottom-left-radius: 2px;
    }

    .message-bot table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0;
        font-size: 0.8rem;
    }

    .message-bot th,
    .message-bot td {
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message-bot th {
        background: rgba(39, 174, 96, 0.2);
    }

    /* Command Tabs */
    #chatbot-tabs {
        padding: 10px;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        background: rgba(0, 0, 0, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    #chatbot-tabs::-webkit-scrollbar {
        height: 0;
    }

    #chatbot-tabs button {
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #bbb;
        padding: 4px 12px;
        border-radius: 15px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s;
    }

    #chatbot-tabs button:hover {
        background: var(--primary-green);
        color: white;
        border-color: var(--primary-green);
    }

    /* Input Area */
    #chatbot-input-container {
        padding: 12px 15px;
    }

    .input-wrapper {
        display: flex;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 4px 12px;
        align-items: center;
    }

    #chatbot-message {
        flex: 1;
        background: none;
        border: none;
        color: white;
        padding: 8px 0;
        outline: none;
        font-size: 0.9rem;
    }

    #send-btn {
        background: none;
        border: none;
        color: var(--primary-green);
        cursor: pointer;
        padding: 5px;
    }

    h3 {
        color: white;
    }
</style>

<script>
    const box = document.getElementById("chatbot-box");
    const input = document.getElementById("chatbot-message");
    const body = document.getElementById("chatbot-body");
    const logo = document.getElementById("chatbot-logo");

    function toggleChatbot() {
        if (body.style.display === "none") {
            body.style.display = "flex";
            logo.style.display = "none";
            input.focus();
        } else {
            body.style.display = "none";
            logo.style.display = "flex";
        }
    }

    function clearChat() {
        box.innerHTML = `<div class="message-bot"><span>Assistant reset. Ready for commands.</span></div>`;
    }

    function handleKeyUp(event) { if (event.key === "Enter") sendChatbotMessage(); }

    function sendStaticCommand(cmd) {
        input.value = cmd;
        sendChatbotMessage();
    }

    async function sendChatbotMessage() {
        const message = input.value.trim();
        if (!message) return;

        appendMessage('user', message);
        input.value = "";

        try {
            const response = await fetch(`/chat/?message=${encodeURIComponent(message)}`);
            const data = await response.json();

            if (data.message) {
                appendMessage('bot', data.message, data.options, data.type);
            }
        } catch (err) {
            appendMessage('bot', "Connection error.");
        }
    }

    function appendMessage(sender, text, options = null, type = null) {
        const msgContainer = document.createElement("div");
        msgContainer.style.display = "flex";
        msgContainer.style.flexDirection = "column";
        msgContainer.style.gap = "8px";
        msgContainer.style.alignSelf = sender === 'user' ? 'flex-end' : 'flex-start';
        msgContainer.style.maxWidth = "80%";

        const msgDiv = document.createElement("div");
        msgDiv.className = sender === 'user' ? 'message-user' : 'message-bot';
        msgDiv.style.maxWidth = "100%"; // override default if needed
        msgDiv.innerHTML = `<span>${sender === 'bot' ? marked.parse(text) : text}</span>`;
        msgContainer.appendChild(msgDiv);

        if (options && options.length > 0) {
            const optDiv = document.createElement("div");
            optDiv.className = "message-options";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.onclick = () => sendStaticCommand(`${type} ${opt}`);
                optDiv.appendChild(btn);
            });
            msgContainer.appendChild(optDiv);
        }

        box.appendChild(msgContainer);
        box.scrollTop = box.scrollHeight;
    }
</script>

<style>
    .message-options {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
    }

    .message-options button {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--primary-green);
        color: var(--primary-green);
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s;
    }

    .message-options button:hover {
        background: var(--primary-green);
        color: white;
    }
</style>
